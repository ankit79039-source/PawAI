<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - PawAI</title>
  <style>
    :root {
      --bg: #090a10;
      --panel: #141218;
      --panel-soft: #1c1621;
      --field: #100f15;
      --line: #2d2833;
      --line-strong: #453545;
      --text: #f8f5fa;
      --muted: #9c96aa;
      --pink: #ff3d91;
      --pink-soft: #ff5aa4;
      --green: #2ee98f;
      --danger: #ff6f91;
      --shadow: 0 24px 70px rgba(0, 0, 0, .45);
      --pink-glow: 0 18px 42px rgba(255, 61, 145, .28);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 78% 8%, rgba(255, 61, 145, .18), transparent 34rem),
        radial-gradient(circle at 12% 90%, rgba(46, 233, 143, .09), transparent 26rem),
        linear-gradient(135deg, #08090f 0%, #121018 58%, #08090f 100%);
      font-family: var(--font);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .navbar,
    .top-row,
    .analysis-header,
    .analysis-item,
    .user-menu,
    .brand {
      display: flex;
      align-items: center;
    }

    .navbar {
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 34px;
    }

    .brand {
      gap: 12px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink-soft));
      box-shadow: var(--pink-glow);
      font-weight: 900;
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .brand .brand-accent,
    .nav-link.active,
    .accent {
      color: var(--pink);
    }

    .tagline,
    .muted {
      color: var(--muted);
    }

    .tagline {
      margin-top: 4px;
      font-size: 14px;
    }

    .user-menu {
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, .75);
      border-radius: 50%;
      object-fit: cover;
      background: var(--panel-soft);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .28);
    }

    .ghost-btn,
    .primary-btn,
    .action-card,
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border-radius: 14px;
      font-weight: 850;
    }

    .ghost-btn,
    .icon-btn {
      border: 1px solid rgba(255, 61, 145, .38);
      color: var(--pink);
      background: rgba(255, 61, 145, .1);
    }

    .ghost-btn {
      padding: 0 20px;
    }

    .icon-btn {
      width: 46px;
    }

    .top-row {
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(255, 61, 145, .35);
      border-radius: 999px;
      color: var(--pink);
      background: rgba(255, 61, 145, .11);
      font-size: 13px;
      font-weight: 850;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(34px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
      gap: 22px;
      align-items: stretch;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 80% 0%, rgba(255, 61, 145, .12), transparent 23rem),
        rgba(20, 18, 24, .92);
      box-shadow: var(--shadow);
    }

    .analyze-card {
      display: grid;
      min-height: 420px;
      padding: 36px;
      place-items: center;
      text-align: center;
    }

    .analyze-ring {
      display: grid;
      width: min(280px, 74vw);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      place-items: center;
      background: radial-gradient(circle, var(--pink) 0, var(--pink-soft) 45%, rgba(255, 61, 145, .2) 46%, rgba(255, 255, 255, .08) 70%);
      box-shadow: 0 0 0 16px rgba(255, 61, 145, .08), 0 0 0 34px rgba(255, 61, 145, .04);
    }

    .record-btn {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      color: var(--pink);
      background: #fff;
      box-shadow: 0 18px 35px rgba(255, 61, 145, .28);
      font-size: 42px;
    }

    .record-btn span {
      display: block;
      font-size: 14px;
      font-weight: 900;
    }

    .analyze-card h2 {
      margin: 24px 0 6px;
      font-size: 30px;
      line-height: 1.2;
    }

    .quick-actions {
      display: grid;
      gap: 14px;
    }

    .action-card {
      justify-content: flex-start;
      gap: 14px;
      width: 100%;
      min-height: 96px;
      padding: 18px;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(20, 18, 24, .82);
      text-align: left;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .24);
    }

    .action-icon {
      display: grid;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      place-items: center;
      color: #fff;
      background: rgba(255, 61, 145, .24);
      font-weight: 900;
    }

    .action-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 17px;
    }

    .analysis-card {
      margin-top: 22px;
      padding: 25px;
    }

    .analysis-header {
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .analysis-header h2 {
      margin-bottom: 0;
      font-size: 22px;
    }

    .analysis-item {
      gap: 18px;
    }

    .analysis-image {
      width: 150px;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
    }

    .analysis-copy {
      flex: 1;
      min-width: 0;
    }

    .analysis-copy h3 {
      margin-bottom: 8px;
      font-size: 19px;
      line-height: 1.35;
    }

    .bottom-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(20, 18, 24, .92);
      box-shadow: var(--shadow);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .nav-link.active {
      background: rgba(255, 61, 145, .11);
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.success {
      border: 1px solid rgba(46, 233, 143, .32);
      color: var(--green);
      background: rgba(46, 233, 143, .1);
    }

    .media-input {
      display: none;
    }

    @media (max-width: 900px) {
      .page {
        width: min(100% - 28px, 680px);
      }

      .navbar,
      .top-row,
      .analysis-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      .user-menu {
        width: 100%;
        justify-content: space-between;
      }

      .analysis-image {
        width: 100%;
        height: 190px;
      }

      .bottom-nav {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 560px) {
      .brand {
        font-size: 21px;
      }

      .ghost-btn {
        min-height: 42px;
        padding: 0 14px;
      }

      .analyze-card,
      .analysis-card {
        padding: 22px;
        border-radius: 20px;
      }

      .record-btn {
        width: 124px;
        height: 124px;
        font-size: 34px;
      }

      .nav-link {
        flex: 1 1 44%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar">
      <a class="brand" href="03-home.html" aria-label="PawAI home">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M8.1 10.4c-1.4.2-2.6-1.1-2.8-2.9C5.1 5.7 6 4.1 7.3 3.9c1.4-.2 2.6 1.1 2.8 2.9.2 1.8-.7 3.4-2 3.6Zm7.8 0c-1.3-.2-2.2-1.8-2-3.6.2-1.8 1.4-3.1 2.8-2.9 1.3.2 2.2 1.8 2 3.6-.2 1.8-1.4 3.1-2.8 2.9ZM4.4 14.2c-1.1.4-2.4-.4-2.9-1.8-.5-1.4-.1-2.8 1-3.2 1.1-.4 2.4.4 2.9 1.8.5 1.4.1 2.8-1 3.2Zm15.2 0c-1.1-.4-1.5-1.8-1-3.2.5-1.4 1.8-2.2 2.9-1.8 1.1.4 1.5 1.8 1 3.2-.5 1.4-1.8 2.2-2.9 1.8Zm-7.6 6.2c-3.5 0-6.4-1.3-6.4-3.8 0-1.5 1.2-2.2 2.2-3 .8-.6 1.4-1.3 2.1-2.2.6-.8 1.2-1.3 2.1-1.3s1.5.5 2.1 1.3c.7.9 1.3 1.6 2.1 2.2 1 .8 2.2 1.5 2.2 3 0 2.5-2.9 3.8-6.4 3.8Z"/>
          </svg>
        </span>
        Paw<span class="brand-accent">AI</span>
      </a>

      <div class="user-menu" aria-label="User controls">
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=120&q=80"
          alt="Whiskers profile"
        >
        <button class="icon-btn" type="button" data-action="Notifications are ready to connect.">N</button>
        <a class="ghost-btn" href="02-login.html">Logout</a>
      </div>
    </header>

    <main>
      <section class="top-row" aria-labelledby="homeTitle">
        <div>
          <span class="pill">Good morning</span>
          <h1 id="homeTitle">Hello, <span class="accent">Whiskers!</span></h1>
        </div>
        <span class="pill">AI ready</span>
      </section>

      <div class="dashboard">
        <section class="card analyze-card" aria-labelledby="analyzeTitle">
          <div>
            <div class="analyze-ring">
              <button class="record-btn" type="button" data-tool="camera">
                <span>REC</span>
              </button>
            </div>
            <h2 id="analyzeTitle">Tap to Analyze</h2>
            <p class="muted">Record your pet's behavior and let AI understand it.</p>
            <div id="homeMessage" class="message" role="status" aria-live="polite"></div>
          </div>
        </section>

        <section class="quick-actions" aria-label="Quick analysis actions">
          <button class="action-card" type="button" data-tool="camera">
            <span class="action-icon">CA</span>
            <span>
              <strong>Camera</strong>
              <span class="muted">Record video</span>
            </span>
          </button>

          <button class="action-card" type="button" data-tool="audio">
            <span class="action-icon">AU</span>
            <span>
              <strong>Audio</strong>
              <span class="muted">Upload or record sound</span>
            </span>
          </button>

          <button class="action-card" type="button" data-tool="gallery">
            <span class="action-icon">GL</span>
            <span>
              <strong>Gallery</strong>
              <span class="muted">Choose image or video</span>
            </span>
          </button>
        </section>
      </div>

      <section class="card analysis-card" aria-labelledby="latestTitle">
        <div class="analysis-header">
          <h2 id="latestTitle">Latest Analysis</h2>
          <span class="pill">Video Analysis</span>
        </div>

        <article class="analysis-item">
          <img
            class="analysis-image"
            src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=300&q=80"
            alt="Whiskers latest analysis"
          >
          <div class="analysis-copy">
            <h3>Whiskers seems happy and playful.</h3>
            <p class="muted">2 May 2025, 10:30 AM</p>
          </div>
          <button class="icon-btn" type="button" data-action="Playing AI speech output">Play</button>
        </article>
      </section>

      <input id="cameraInput" class="media-input" type="file" accept="image/*,video/*" capture="environment">
      <input id="audioInput" class="media-input" type="file" accept="audio/*" capture="microphone">
      <input id="galleryInput" class="media-input" type="file" accept="image/*,video/*">
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a class="nav-link active" href="03-home.html">Home</a>
      <a class="nav-link" href="04-account.html">History</a>
      <a class="nav-link" href="06-chatbot.html">PawBot</a>
      <a class="nav-link" href="05-settings.html">Settings</a>
    </nav>
  </div>

  <script>
    const homeMessage = document.querySelector("#homeMessage");
    const analysisImage = document.querySelector(".analysis-image");
    const analysisTitle = document.querySelector(".analysis-copy h3");
    const analysisTime = document.querySelector(".analysis-copy .muted");
    const actionButtons = document.querySelectorAll("[data-action]");
    const toolButtons = document.querySelectorAll("[data-tool]");
    const mediaInputs = {
      camera: document.querySelector("#cameraInput"),
      audio: document.querySelector("#audioInput"),
      gallery: document.querySelector("#galleryInput")
    };

    function showHomeMessage(text) {
      if (!homeMessage) return;

      homeMessage.textContent = text;
      homeMessage.className = "message success show";
    }

    function updateLatestAnalysis(file, source) {
      const selectedAt = new Date().toLocaleString([], {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });

      if (analysisTitle) {
        analysisTitle.textContent = `${file.name} is ready for ${source} analysis.`;
      }

      if (analysisTime) {
        analysisTime.textContent = selectedAt;
      }

      if (analysisImage && file.type.startsWith("image/")) {
        analysisImage.src = URL.createObjectURL(file);
      }
    }

    function openMediaTool(tool) {
      const input = mediaInputs[tool];
      if (!input) return;

      input.click();
    }

    actionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        showHomeMessage(button.dataset.action);
      });
    });

    toolButtons.forEach((button) => {
      button.addEventListener("click", () => {
        openMediaTool(button.dataset.tool);
      });
    });

    Object.entries(mediaInputs).forEach(([tool, input]) => {
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;

        const label = tool.charAt(0).toUpperCase() + tool.slice(1);
        updateLatestAnalysis(file, label);
        showHomeMessage(`${label} file selected: ${file.name}`);
      });
    });
  </script>
</body>
</html>
